<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        color: white;
        margin-bottom: 30px;
      }

      header h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      header p {
        font-size: 1.2rem;
        opacity: 0.9;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s;
      }

      .stat-card:hover {
        transform: translateY(-5px);
      }

      .stat-card h3 {
        font-size: 0.9rem;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }

      .stat-card .value {
        font-size: 2.5rem;
        font-weight: bold;
        color: #667eea;
      }

      .filters {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .filter-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .filter-btn {
        padding: 10px 20px;
        border: 2px solid #667eea;
        background: white;
        color: #667eea;
        border-radius: 25px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.3s;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: #667eea;
        color: white;
      }

      .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
      }

      .project-card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: all 0.3s;
        cursor: pointer;
      }

      .project-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      }

      .project-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 15px;
      }

      .project-name {
        font-size: 1.5rem;
        font-weight: bold;
        color: #333;
        margin-bottom: 5px;
      }

      .project-type {
        display: inline-block;
        padding: 5px 12px;
        background: #e0e7ff;
        color: #667eea;
        border-radius: 15px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-right: 5px;
        margin-top: 5px;
      }

      .project-info {
        margin-top: 15px;
      }

      .info-row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        font-size: 0.9rem;
      }

      .info-label {
        font-weight: 600;
        color: #666;
        width: 80px;
      }

      .info-value {
        color: #333;
      }

      .git-status {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .git-badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .git-badge.clean {
        background: #d1fae5;
        color: #065f46;
      }

      .git-badge.modified {
        background: #fef3c7;
        color: #92400e;
      }

      .git-badge.no-git {
        background: #fee2e2;
        color: #991b1b;
      }

      .branch-name {
        color: #667eea;
        font-weight: 600;
      }

      .loading {
        text-align: center;
        color: white;
        font-size: 1.5rem;
        padding: 50px;
      }

      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
        padding: 20px;
        border-radius: 12px;
        margin: 20px 0;
      }

      .refresh-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #667eea;
        color: white;
        border: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        cursor: pointer;
        font-size: 1.5rem;
        transition: all 0.3s;
      }

      .refresh-btn:hover {
        background: #764ba2;
        transform: rotate(180deg) scale(1.1);
      }

      .modified-badge {
        background: #fbbf24;
        color: white;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 0.7rem;
        font-weight: 600;
      }

      .readme-preview {
        margin-top: 15px;
        padding: 12px;
        background: #f9fafb;
        border-radius: 8px;
        border-left: 3px solid #667eea;
        font-size: 0.85rem;
        color: #555;
        line-height: 1.5;
        max-height: 100px;
        overflow: hidden;
      }

      .readme-badge {
        display: inline-block;
        padding: 3px 8px;
        background: #10b981;
        color: white;
        border-radius: 10px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .no-readme {
        color: #999;
        font-style: italic;
        font-size: 0.85rem;
      }

      /* 모달 스타일 */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        overflow: auto;
      }

      .modal.show {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background-color: white;
        margin: auto;
        padding: 30px;
        border-radius: 12px;
        max-width: 800px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        position: relative;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid #e5e7eb;
      }

      .modal-header h2 {
        color: #333;
        font-size: 1.8rem;
      }

      .close-btn {
        font-size: 2rem;
        font-weight: bold;
        color: #999;
        cursor: pointer;
        background: none;
        border: none;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all 0.3s;
      }

      .close-btn:hover {
        background: #fee2e2;
        color: #dc2626;
      }

      .modal-body {
        color: #333;
        line-height: 1.8;
        font-size: 1rem;
      }

      .modal-body pre {
        background: #f3f4f6;
        padding: 15px;
        border-radius: 8px;
        overflow-x: auto;
      }

      .modal-body code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'Monaco', 'Courier New', monospace;
      }

      .modal-body h1,
      .modal-body h2,
      .modal-body h3 {
        margin-top: 20px;
        margin-bottom: 10px;
        color: #667eea;
      }

      .modal-body ul,
      .modal-body ol {
        margin-left: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📊 Project Dashboard</h1>
        <p>프로젝트 관리 대시보드</p>
      </header>

      <div class="stats" id="stats">
        <div class="stat-card">
          <h3>Total Projects</h3>
          <div class="value" id="totalProjects">-</div>
        </div>
        <div class="stat-card">
          <h3>Git Repositories</h3>
          <div class="value" id="gitRepos">-</div>
        </div>
        <div class="stat-card">
          <h3>Modified</h3>
          <div class="value" id="modifiedCount">-</div>
        </div>
        <div class="stat-card">
          <h3>Node.js Projects</h3>
          <div class="value" id="nodeProjects">-</div>
        </div>
      </div>

      <div class="filters">
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="node">Node.js</button>
          <button class="filter-btn" data-filter="python">Python</button>
          <button class="filter-btn" data-filter="java">Java</button>
          <button class="filter-btn" data-filter="modified">Modified</button>
          <button class="filter-btn" data-filter="no-git">No Git</button>
        </div>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        Loading projects...
      </div>

      <div id="error" class="error" style="display: none"></div>

      <div class="projects-grid" id="projectsGrid"></div>
    </div>

    <button class="refresh-btn" id="refreshBtn" title="Refresh">🔄</button>

    <!-- README 모달 -->
    <div id="readmeModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">README</h2>
          <button class="close-btn" id="closeModal">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <script>
      let allProjects = [];
      let currentFilter = 'all';

      // 프로젝트 로드
      async function loadProjects() {
        try {
          console.log('Loading projects...');
          document.getElementById('loading').style.display = 'block';
          document.getElementById('error').style.display = 'none';

          const response = await fetch('/api/projects');
          console.log('Response status:', response.status);

          const data = await response.json();
          console.log('Projects data:', data);

          if (data.success) {
            allProjects = data.projects;
            console.log('Total projects loaded:', allProjects.length);
            updateStats();
            displayProjects(allProjects);
          } else {
            throw new Error(data.error);
          }
        } catch (error) {
          console.error('Error loading projects:', error);
          document.getElementById('error').textContent = 'Error loading projects: ' + error.message;
          document.getElementById('error').style.display = 'block';
        } finally {
          document.getElementById('loading').style.display = 'none';
        }
      }

      // 통계 업데이트
      function updateStats() {
        const total = allProjects.length;
        const gitRepos = allProjects.filter((p) => p.git.hasGit).length;
        const modified = allProjects.filter((p) => p.git.changes > 0).length;
        const nodeProjects = allProjects.filter((p) => p.types.includes('Node.js')).length;

        document.getElementById('totalProjects').textContent = total;
        document.getElementById('gitRepos').textContent = gitRepos;
        document.getElementById('modifiedCount').textContent = modified;
        document.getElementById('nodeProjects').textContent = nodeProjects;
      }

      // 프로젝트 표시
      function displayProjects(projects) {
        const grid = document.getElementById('projectsGrid');
        grid.innerHTML = '';

        if (projects.length === 0) {
          grid.innerHTML = '<p style="color: white; grid-column: 1/-1;">No projects found.</p>';
          return;
        }

        projects.forEach((project) => {
          const card = createProjectCard(project);
          grid.appendChild(card);
        });
      }

      // 프로젝트 카드 생성
      function createProjectCard(project) {
        const card = document.createElement('div');
        card.className = 'project-card';

        const typeBadges = project.types.map((type) => `<span class="project-type">${type}</span>`).join('');

        let gitBadgeClass = 'no-git';
        let gitBadgeText = 'No Git';

        if (project.git.hasGit) {
          gitBadgeClass = project.git.changes > 0 ? 'modified' : 'clean';
          gitBadgeText = project.git.changes > 0 ? `${project.git.changes} changes` : 'Clean';
        }

        const branchInfo = project.git.hasGit
          ? `<span class="branch-name">${project.git.branch}</span>`
          : '';

        const syncInfo =
          project.git.ahead > 0 || project.git.behind > 0
            ? `<span style="font-size: 0.8rem; color: #666;">↑${project.git.ahead} ↓${project.git.behind}</span>`
            : '';

        // README 미리보기
        let readmeSection = '';
        if (project.readme && project.readme.exists) {
          readmeSection = `
            <div class="readme-preview">
              <span class="readme-badge">📄 README</span>
              <div>${project.readme.preview}</div>
            </div>
          `;
        } else {
          readmeSection = `
            <div class="readme-preview">
              <span class="no-readme">No README.md</span>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="project-header">
            <div>
              <div class="project-name">${project.name}</div>
              <div>${typeBadges}</div>
            </div>
            ${project.git.changes > 0 ? '<span class="modified-badge">MODIFIED</span>' : ''}
          </div>
          <div class="project-info">
            <div class="info-row">
              <span class="info-label">Git:</span>
              <div class="git-status">
                <span class="git-badge ${gitBadgeClass}">${gitBadgeText}</span>
                ${branchInfo}
                ${syncInfo}
              </div>
            </div>
            <div class="info-row">
              <span class="info-label">Modified:</span>
              <span class="info-value">${project.modified.text}</span>
            </div>
          </div>
          ${readmeSection}
        `;

        card.addEventListener('click', () => {
          showProjectDetails(project);
        });

        return card;
      }

      // 프로젝트 상세 정보 모달 표시
      function showProjectDetails(project) {
        console.log('Project Details:', project);

        const modal = document.getElementById('readmeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        modalTitle.textContent = `${project.name} - README`;

        if (project.readme && project.readme.exists) {
          // 마크다운을 간단히 HTML로 변환 (기본적인 변환만)
          let html = project.readme.content
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>');

          html = '<p>' + html + '</p>';
          modalBody.innerHTML = html;
        } else {
          modalBody.innerHTML = `
            <p style="color: #999;">이 프로젝트에는 README.md 파일이 없습니다.</p>
            <p>프로젝트 정보:</p>
            <ul>
              <li><strong>경로:</strong> ${project.path}</li>
              <li><strong>타입:</strong> ${project.types.join(', ')}</li>
              <li><strong>Git 브랜치:</strong> ${project.git.branch || 'N/A'}</li>
            </ul>
          `;
        }

        modal.classList.add('show');
      }

      // 모달 닫기
      function closeModal() {
        const modal = document.getElementById('readmeModal');
        modal.classList.remove('show');
      }

      // 필터링
      function filterProjects(filter) {
        currentFilter = filter;

        // 버튼 활성화 상태 변경
        document.querySelectorAll('.filter-btn').forEach((btn) => {
          btn.classList.remove('active');
          if (btn.dataset.filter === filter) {
            btn.classList.add('active');
          }
        });

        let filtered = allProjects;

        switch (filter) {
          case 'node':
            filtered = allProjects.filter((p) => p.types.includes('Node.js'));
            break;
          case 'python':
            filtered = allProjects.filter((p) => p.types.includes('Python'));
            break;
          case 'java':
            filtered = allProjects.filter((p) => p.types.includes('Java/Spring'));
            break;
          case 'modified':
            filtered = allProjects.filter((p) => p.git.changes > 0);
            break;
          case 'no-git':
            filtered = allProjects.filter((p) => !p.git.hasGit);
            break;
          default:
            filtered = allProjects;
        }

        displayProjects(filtered);
      }

      // 이벤트 리스너
      document.querySelectorAll('.filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          filterProjects(btn.dataset.filter);
        });
      });

      document.getElementById('refreshBtn').addEventListener('click', () => {
        loadProjects();
      });

      // 모달 이벤트 리스너
      document.getElementById('closeModal').addEventListener('click', closeModal);

      // 모달 배경 클릭 시 닫기
      document.getElementById('readmeModal').addEventListener('click', (e) => {
        if (e.target.id === 'readmeModal') {
          closeModal();
        }
      });

      // ESC 키로 모달 닫기
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
        }
      });

      // 초기 로드
      loadProjects();

      // 자동 새로고침 (30초마다)
      setInterval(loadProjects, 30000);
    </script>
  </body>
</html>
